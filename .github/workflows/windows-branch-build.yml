name: TakVPN Windows branch build

on:
  push:
    branches:
      - android-ui-parity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and publish Windows x64
        run: dotnet publish TakVPN.Windows/TakVPN.Windows.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TakVPN-Windows-branch-build
          path: TakVPN.Windows/bin/Release/net8.0-windows/win-x64/publish/
          if-no-files-found: error
          retention-days: 7
