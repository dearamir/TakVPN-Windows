name: TakVPN Windows build and release

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

# Serialize release workflows so two runs cannot select the same version.
concurrency:
  group: takvpn-windows-release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Prepare shared TakVPN application icon
        shell: pwsh
        run: |
          $iconBase64 = Get-Content "TakVPN.Windows/Assets/TakVPN.ico.b64" -Raw
          $iconBytes = [Convert]::FromBase64String($iconBase64)
          New-Item -ItemType Directory -Force -Path "TakVPN.Windows/Assets" | Out-Null
          [System.IO.File]::WriteAllBytes("TakVPN.Windows/Assets/TakVPN.ico", $iconBytes)
          if ((Get-Item "TakVPN.Windows/Assets/TakVPN.ico").Length -lt 1000) { throw "TakVPN icon file is invalid" }
      - name: Download official Xray core and Wintun
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/XTLS/Xray-core/releases/latest" -Headers @{ "User-Agent" = "TakVPN-Windows-CI" }
          $asset = $release.assets | Where-Object { $_.name -eq "Xray-windows-64.zip" } | Select-Object -First 1
          if (-not $asset) { throw "Official Xray release does not contain Xray-windows-64.zip" }
          New-Item -ItemType Directory -Force -Path "TakVPN.Windows/tools/xray" | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "xray-windows-64.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          if ($asset.digest -and $asset.digest.StartsWith("sha256:")) {
            $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            $expected = $asset.digest.Substring(7).ToLowerInvariant()
            if ($actual -ne $expected) { throw "Xray archive SHA-256 mismatch" }
          }
          $extract = Join-Path $env:RUNNER_TEMP "xray-extract"
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $xray = Get-ChildItem $extract -Filter "xray.exe" -Recurse | Select-Object -First 1
          $wintun = Get-ChildItem $extract -Filter "wintun.dll" -Recurse | Select-Object -First 1
          if (-not $xray -or -not $wintun) { throw "Xray or Wintun binary missing from official release archive" }
          Copy-Item $xray.FullName "TakVPN.Windows/tools/xray/xray.exe" -Force
          Copy-Item $wintun.FullName "TakVPN.Windows/tools/xray/wintun.dll" -Force
          Get-ChildItem $extract -File | Where-Object { $_.Name -match "^(geoip|geosite).*\.dat$|^LICENSE" } | ForEach-Object { Copy-Item $_.FullName "TakVPN.Windows/tools/xray/$($_.Name)" -Force }
      - name: Download official sing-box core for Hysteria2
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/SagerNet/sing-box/releases/latest" -Headers @{ "User-Agent" = "TakVPN-Windows-CI" }
          $asset = $release.assets | Where-Object { $_.name -eq "sing-box-$($release.tag_name.TrimStart('v'))-windows-amd64.zip" } | Select-Object -First 1
          if (-not $asset) { $asset = $release.assets | Where-Object { $_.name -match "windows-amd64.zip$" -and $_.name -notmatch "legacy" } | Select-Object -First 1 }
          if (-not $asset) { throw "Official sing-box Windows amd64 archive not found" }
          $zip = Join-Path $env:RUNNER_TEMP "sing-box-windows-amd64.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          $extract = Join-Path $env:RUNNER_TEMP "sing-box-extract"
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $binary = Get-ChildItem $extract -Filter "sing-box.exe" -Recurse | Select-Object -First 1
          if (-not $binary) { throw "sing-box.exe missing from official release archive" }
          New-Item -ItemType Directory -Force -Path "TakVPN.Windows/tools/sing-box" | Out-Null
          Copy-Item $binary.FullName "TakVPN.Windows/tools/sing-box/sing-box.exe" -Force
          Copy-Item "TakVPN.Windows/tools/xray/wintun.dll" "TakVPN.Windows/tools/sing-box/wintun.dll" -Force
          & "TakVPN.Windows/tools/sing-box/sing-box.exe" version
          if ($LASTEXITCODE -ne 0) { throw "sing-box binary smoke test failed" }
      - name: Publish self-contained Windows x64 app
        run: dotnet publish TakVPN.Windows/TakVPN.Windows.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true
      - name: Smoke test bundled Xray
        shell: pwsh
        run: |
          & "TakVPN.Windows/tools/xray/xray.exe" version
          if ($LASTEXITCODE -ne 0) { throw "Xray binary smoke test failed" }
      - name: Bundle Xray and Wintun
        shell: pwsh
        run: |
          $publish = "TakVPN.Windows/bin/Release/net8.0-windows/win-x64/publish"
          $tools = Join-Path $publish "tools/xray"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          Copy-Item "TakVPN.Windows/tools/xray/*" $tools -Recurse -Force
      - name: Create installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $candidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe", "$env:ChocolateyInstall\lib\innosetup\tools\ISCC.exe")
          $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) { $command = Get-Command "ISCC.exe" -ErrorAction SilentlyContinue; if ($command) { $iscc = $command.Source } }
          if (-not $iscc) { throw "Inno Setup compiler not found" }
          & $iscc "installer/TakVPN.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          Copy-Item "installer/TakVPN-Setup-x64.exe" "TakVPN-Setup-x64.exe" -Force
      - name: Create portable ZIP
        shell: pwsh
        run: |
          $publish = "TakVPN.Windows/bin/Release/net8.0-windows/win-x64/publish"
          Compress-Archive -Path "$publish/*" -DestinationPath "TakVPN-Windows-x64-portable.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: TakVPN-Windows-x64
          path: |
            TakVPN-Setup-x64.exe
            TakVPN-Windows-x64-portable.zip
          if-no-files-found: error
      - name: Publish independent Windows release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tags = git tag -l "windows-v0.1.*"
          $patches = @($tags | ForEach-Object { if ($_ -match "^windows-v0\.1\.(\d+)$") { [int]$Matches[1] } })
          $nextPatch = if ($patches.Count -gt 0) { ($patches | Measure-Object -Maximum).Maximum + 1 } else { 1 }
          $tag = "windows-v0.1.$nextPatch"
          gh release create $tag "TakVPN-Setup-x64.exe" "TakVPN-Windows-x64-portable.zip" --title "TakVPN Windows $tag" --notes "Independent Windows x64 build of TakVPN." --latest
